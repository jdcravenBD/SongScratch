# Publishes the built app to GitHub Pages on every push to main.
#
# Pages serves it over HTTPS with a real certificate, which is what voice memos
# need — getUserMedia/MediaRecorder refuse to run on a plain http:// origin, and
# a self-signed certificate on a phone means clicking through a warning every
# time. It is also reachable off your own network, so there is no same-Wi-Fi
# condition to satisfy.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The site then lives at https://<user>.github.io/<repo>/
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
