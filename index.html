<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout run under the iPhone notch/home bar,
         which the CSS then pads back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Song Scratch &#8212; a lightweight place to scratch down chord progressions, lyrics and voice notes."
    />

    <!-- iOS standalone / home-screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Song Scratch" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

    <title>Song Scratch</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Song Scratch needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
